services:
  app:
    environment:
      Sungrow__AppFile: /run/secrets/sungrow_app
      Sungrow__CallSpacingSeconds: ${SUNGROW_CALL_SPACING_SECONDS:-15}
      Sungrow__LiveBackgroundSeconds: ${SUNGROW_LIVE_BACKGROUND_SECONDS:-600}
      Sungrow__LiveMinCloudSeconds: ${SUNGROW_LIVE_MIN_CLOUD_SECONDS:-300}
      Sungrow__LiveMaxAgeSeconds: ${SUNGROW_LIVE_MAX_AGE_SECONDS:-900}
      Sungrow__HistoryRetryHours: ${SUNGROW_HISTORY_RETRY_HOURS:-24}
      Sungrow__RefreshMinutes: ${SUNGROW_REFRESH_MINUTES:-1440}
    secrets:
      - sungrow_app
secrets:
  sungrow_app:
    file: ${SUNGROW_APP_SECRET:-./secrets/sungrow-app.json}

